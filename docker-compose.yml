services:
  api:
    build:
      context: ./interface/src
    container_name: omnidialer-api
    volumes:
      - ./interface/src:/app
    ports:
      - '1440:1440'
    networks:
      - network1
    stop_signal: SIGINT
    tty: true
    stdin_open: true
    depends_on:
      - job_server
      - redis
      - postgresql
    environment:
      - GEARMAN_JOB_SERVERS=${GEARMAN_JOB_SERVERS}

  job_server:
    image: artefactual/gearmand:1.1.18-alpine
    container_name: gearman_job_server_1
    ports:
      - '4730:4730'
    networks:
      - network1
    command: gearmand -t 1

  worker:
    image: omnidialer_worker
    container_name: start-campaign-1
    build:
      context: ./workers/handle-campaign/src
    networks:
      - network1
    tty: true
    stdin_open: true
    environment:
      - ASTERISK_HOST=${ASTERISK_HOST}
      - ASTERISK_PORT=${ASTERISK_PORT}
      - ASTERISK_USER=${ASTERISK_USER}
      - ASTERISK_PASS=${ASTERISK_PASS}
      - ASTERISK_APP=${ASTERISK_APP}
      - REDIS_OML_SERVER=${REDIS_OML_SERVER}
      - REDIS_OML_PORT=${REDIS_OML_PORT}
      - REDIS_DIALER_SERVER=${REDIS_DIALER_SERVER}
      - REDIS_DIALER_PORT=${REDIS_DIALER_PORT}
      - POSTGRES_OML_PASSWORD=${POSTGRES_OML_PASSWORD}
      - POSTGRES_OML_SERVER=${POSTGRES_OML_SERVER}
      - POSTGRES_OML_PORT=${POSTGRES_OML_PORT}
      - POSTGRES_DIALER_PASSWORD=${POSTGRES_DIALER_PASSWORD}
      - POSTGRES_DIALER_SERVER=${POSTGRES_DIALER_SERVER}
      - POSTGRES_DIALER_PORT=${POSTGRES_DIALER_PORT}
      - TZ=${TZ}
      - GEARMAN_JOB_SERVERS=${GEARMAN_JOB_SERVERS}
      - GEARMAN_JOBS=start-campaign
      - PYTHON_LOGLEVEL=${PYTHON_LOGLEVEL}
      - DIALER_ACD_HOST=${DIALER_ACD_HOST}
    depends_on:
      - job_server
      - postgresql
      - redis


  redis:
    container_name: omnidialer-redis
    dns: 8.8.8.8
    environment:
      - BIND_IP=0.0.0.0
    networks:
      - network1
    ports:
      - '6380:6380'
    expose:
      - '6380'
    image: redis:7.2.5-alpine
    volumes:
      - redis_omnidialer:/data
    command: redis-server --port 6380

  redisinsight:
    container_name: omnidialer-redisinsight
    dns: 8.8.8.8
    environment:
      - TZ=${TZ}
      - BIND_IP=0.0.0.0
    networks:
      - network1
    ports:
      - '5540:5540'
    expose:
      - '5540'
    image: redis/redisinsight:latest
    privileged: true
    restart: on-failure
    stop_grace_period: 1m30s
    volumes:
      - redis_redisinsight:/data

  postgresql:
    container_name: dialer-postgres
    dns: 8.8.8.8
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${POSTGRES_DIALER_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DIALER_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DIALER_DB}
      - PGPORT=5433
    image: postgres:14.9-bullseye
    networks:
      - network1
    expose:
      - "5433"
    ports:
      - ${POSTGRES_DIALER_PORT}:5433
    privileged: true
    restart: on-failure
    stop_grace_period: 1m30s
    volumes:
      - omnidialer-postgresql:/var/lib/postgresql/data
      - ./omnidialer.sql:/docker-entrypoint-initdb.d/init.sql


  websocket_ari:
    container_name: omnidialer_websocket_ari
    build:
      context: ./websocket_ari/src
    volumes:
      - ./websocket_ari/src:/app
    networks:
      - network1
    tty: true
    stdin_open: true
    environment:
      - ASTERISK_HOST=${ASTERISK_HOST}
      - ASTERISK_PORT=${ASTERISK_PORT}
      - ASTERISK_USER=${ASTERISK_USER}
      - ASTERISK_PASS=${ASTERISK_PASS}
      - ASTERISK_APP=${ASTERISK_APP}
      - ASTERISK_APP_DIALER=${ASTERISK_APP_DIALER}
      - TZ=${TZ}
      - GEARMAN_JOB_SERVERS=${GEARMAN_JOB_SERVERS}
    depends_on:
      - job_server
      - postgresql
      - worker


  asterisk:
    container_name: omnidialer-asterisk
    build:
      context: ./asterisk/
    volumes:
      - ./asterisk/conf:/etc/asterisk
    dns: 8.8.8.8
    environment:
      - TZ=${TZ}
      - ARI_USER=${ASTERISK_USER}
      - ARI_PASS=${ASTERISK_PASS}
      - ASTERISK_DIALER_HOSTNAME=0.0.0.0
      - OMLACD_HOSTNAME=${OMLACD_SIP_HOSTNAME}
      # - PSTNGW_SIP_USER=${PSTNGW_SIP_USER}
      # - PSTNGW_SIP_PASS=${PSTNGW_SIP_PASS}
      # - PSTNGW_HOSTNAME=${PSTNGW_HOSTNAME}
      # - PSTNGW_REGISTER=${PSTNGW_REGISTER}
      # - PSTNGW_SIP_AUTH=${PSTNGW_SIP_AUTH}
    networks:
      - network1
    privileged: true
    restart: on-failure
    stop_grace_period: 30s
    working_dir: /etc/asterisk
    
    
  call_manager:
    build:
      target: run
      context: ./call_manager/
    volumes:
      - ./call_manager/src:/app
    container_name: omnidialer-call_manager
    depends_on:
      - asterisk
    #image: ${OMLDIALER_CALL_MANAGER_IMG}
    command: python /app/dialer_call_manager.py
    environment:
      - TZ=${TZ}
      - REDIS_HOSTNAME=${REDIS_OML_SERVER}
      - REDIS_PORT=${REDIS_OML_PORT}
      - ARI_HOST=${ASTERISK_HOST}
      - ARI_PORT=${ASTERISK_PORT}
      - ARI_USER=${ASTERISK_USER}
      - ARI_PASS=${ASTERISK_PASS}
    restart: on-failure
    stop_grace_period: 30s
    networks:
      - network1  
    

networks:
  network1:
    name: ${NETWORK}
    external: true

volumes:
  omnidialer-postgresql:
  redis_redisinsight:
  redis_omnidialer:
