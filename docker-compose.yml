services:
  # Flask HTTP API server
  api:
    build:
      target: run
      context: ./interface/src
    image: ${API_IMG}
    ports:
      - '1440:1440'
    networks:
      - network1
    stop_signal: SIGINT
    tty: true
    stdin_open: true
    depends_on:
      - job_server
      - postgres
    environment:
      - GEARMAN_JOB_SERVERS=${GEARMAN_JOB_SERVERS}
  # Gearman Job Server
  job_server:
    image: ${GEARMAN_IMG}
    ports:
      - '4730:4730'
    networks:
      - network1
    command: gearmand -t 1
  # Worker Dialer Scheduler 
  scheduler_worker:
    build:
      context: ./scheduler/src
    image: ${SCHEDULER_IMG}  
    ports:
      - '1441:1441'
    networks:
      - network1
    stop_signal: SIGINT
    tty: true
    stdin_open: true
    depends_on:
      - job_server
    environment:
      - GEARMAN_JOB_SERVERS=${GEARMAN_JOB_SERVERS}
      - REDIS_DIALER_SERVER=${REDIS_DIALER_SERVER}
      - REDIS_DIALER_PORT=${REDIS_DIALER_PORT}
      - TZ=${TZ}
  # Worker Dialer Websocket Event LISTENER
  listener_worker:
    build:
      context: ./websocket_ari/src
    image: ${LISTENER_IMG}  
    networks:
      - network1
    tty: true
    stdin_open: true
    environment:
      - ASTERISK_HOST=${ASTERISK_HOST}
      - ASTERISK_PORT=${ASTERISK_PORT}
      - ASTERISK_USER=${ASTERISK_USER}
      - ASTERISK_PASS=${ASTERISK_PASS}
      - ASTERISK_APP=${ASTERISK_APP}
      - ASTERISK_APP_DIALER=${ASTERISK_APP_DIALER}
      - GEARMAN_JOB_SERVERS=${GEARMAN_JOB_SERVERS}
      - TZ=${TZ}
    depends_on:
      - job_server
      - postgres
      - start_campaign_worker
      - asterisk
  # Worker Dialer Process Contact
  process_contact_worker:
    build:
      context: ./workers/handle-campaign/src
    image: ${WORKER_IMG}
    deploy:
      replicas: ${PROCESS_CONTACT_REPLICAS}
    env_file: .env
    environment:
      - GEARMAN_JOBS=process-contact
    depends_on:
      - job_server
      - postgres
    networks:
      - network1
  # Worker Dialer Process Campaign
  process_campaign_worker:
    image: ${WORKER_IMG}
    deploy:
      replicas: ${PROCESS_CAMPAIGN_REPLICAS}
    env_file: .env
    environment:
      - GEARMAN_JOBS=process-campaign
      - CAPS=${CAPS}
    networks:
      - network1
  # Worker Dialer Process Event
  process_event_worker:
    image: ${WORKER_IMG}
    deploy:
      replicas: ${PROCESS_EVENT_REPLICAS}
    env_file: .env
    environment:
      - GEARMAN_JOBS=process-event
    networks:
      - network1  
  # Worker Dialer Start Campaign
  start_campaign_worker:
    image: ${WORKER_IMG}
    networks:
      - network1
    tty: true
    stdin_open: true
    env_file: .env
    depends_on:
      - job_server
      - postgres
  # Worker Dialer Create Campaign
  create_campaign_worker:
    image: ${WORKER_IMG}
    env_file: .env
    depends_on:
      - job_server
      - postgres
    environment:
      - GEARMAN_JOBS=create-campaign
    networks:
      - network1
  # Worker Dialer Resume Campaign
  resume_campaign_worker:
    image: ${WORKER_IMG}
    env_file: .env
    depends_on:
      - job_server
      - postgres
    environment:
      - GEARMAN_JOBS=resume-campaign
    networks:
      - network1
  # Worker Dialer Edit Campaign
  edit_campaign_worker:
    image: ${WORKER_IMG}
    env_file: .env
    depends_on:
      - job_server
      - postgres
    environment:
      - GEARMAN_JOBS=edit-campaign
    networks:
      - network1
  # Worker Dialer Stop Campaign
  stop_campaign_worker:
    image: ${WORKER_IMG}
    env_file: .env
    depends_on:
      - job_server
      - postgres
    environment:
      - GEARMAN_JOBS=stop-campaign
    networks:
      - network1
  # Worker Dialer Pause Campaign
  pause_campaign_worker:
    image: ${WORKER_IMG}
    env_file: .env
    depends_on:
      - job_server
      - postgres
    environment:
      - GEARMAN_JOBS=pause-campaign
    networks:
      - network1
  # Worker Dialer Delete Campaign
  delete_campaign_worker:
    image: ${WORKER_IMG}
    env_file: .env
    depends_on:
      - job_server
      - postgres
    environment:
      - GEARMAN_JOBS=delete-campaign
    networks:
      - network1
  # Worker Dialer Schedule Contact
  schedule_contact_worker:
    image: ${WORKER_IMG}
    env_file: .env
    depends_on:
      - job_server
      - postgres
    environment:
      - GEARMAN_JOBS=schedule-contact
    networks:
      - network1
  # Worker Dialer Send Reports
  send_reports_worker:
    image: ${WORKER_IMG}
    env_file: .env
    depends_on:
      - job_server
      - postgres
    environment:
      - GEARMAN_JOBS=send-reports
    networks:
      - network1
  # Worker Dialer Add Incidence Rule Disposition
  add_incidence_rule_disposition_worker:
    image: ${WORKER_IMG}
    env_file: .env
    depends_on:
      - job_server
      - postgres
    environment:
      - GEARMAN_JOBS=add-incidence-rule-disposition
    networks:
      - network1
  # Worker Dialer Create Incidence Rule
  create_incidence_rule_worker:
    image: ${WORKER_IMG}
    env_file: .env
    depends_on:
      - job_server
      - postgres
    environment:
      - GEARMAN_JOBS=create-incidence-rule
    networks:
      - network1
  # Worker Dialer Delete Incidence Rule
  delete_incidence_rule_worker:
    image: ${WORKER_IMG}
    env_file: .env
    depends_on:
      - job_server
      - postgres
    environment:
      - GEARMAN_JOBS=delete-incidence-rule
    networks:
      - network1
  # Worker Dialer Update Incidence Rule
  update_incidence_rule_worker:
    image: ${WORKER_IMG}
    env_file: .env
    depends_on:
      - job_server
      - postgres
    environment:
      - GEARMAN_JOBS=update-incidence-rule
    networks:
      - network1  
  # Worker Dialer Schedule Agenda
  schedule_agenda_worker:
    image: ${WORKER_IMG}
    env_file: .env
    depends_on:
      - job_server
      - postgres
    environment:
      - GEARMAN_JOBS=schedule-agenda
    networks:
      - network1
  # Worker Dialer Change Database
  change_database_worker:
    image: ${WORKER_IMG}
    env_file: .env
    depends_on:
      - job_server
      - postgres
    environment:
      - GEARMAN_JOBS=change-database
    networks:
      - network1    
  # Dialer Asterisk ARI server
  asterisk:
    image: ${ASTERISK_IMG}  
    build:
      context: ./asterisk/
    env_file:
      - .env    
    privileged: true
    restart: on-failure
    stop_grace_period: 30s
    working_dir: /etc/asterisk
    networks:
      - network1
    ports:
      - 10061:10061/udp
  # Dialer Dialplan ARI-App chan_tel_dialer
  dialplan:
    image: ${DIALPLAN_IMG}  
    build:
      target: run
      context: ./dialplan/
    depends_on:
      - asterisk
    env_file:
      - .env  
    restart: on-failure
    stop_grace_period: 30s
    networks:
      - network1
  # PostgreSQL Database
  postgres:
    image: ${POSTGRES_IMG}
    dns: 8.8.8.8
    environment:
      - POSTGRES_USER=${POSTGRES_DIALER_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DIALER_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DIALER_DB}
      - PGPORT=${POSTGRES_DIALER_PORT}
      - TZ=${TZ}
    networks:
      - network1
    ports:
      - ${POSTGRES_DIALER_PORT}:${POSTGRES_DIALER_PORT}
    privileged: true
    restart: on-failure
    stop_grace_period: 1m30s
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./omnidialer.sql:/docker-entrypoint-initdb.d/init.sql
  # Redis cache DB
  redis:
    image: ${REDIS_IMG}
    dns: 8.8.8.8
    environment:
      - BIND_IP=0.0.0.0
    networks:
      - network1
    expose:
      - '6379'    
    volumes:
      - redis:/data
    command: redis-server

networks:
  network1:
    name: ${NETWORK}
    external: true

volumes:
  postgres:
  redis:
  redis_redisinsight:
