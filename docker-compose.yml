networks:
  omnileads:
    name: ${NETWORK}
    external: true



volumes:

  dialer-postgresql:

services:

  dialer-api:
    build:
      target: run
      context: ./interface/src
    image: ${API_IMG}
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:1440/"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s
    ports:
      - ${DIALER_API_EXT_BIND_IP:-0.0.0.0}:${DIALER_API_EXT_PORT:-1440}:1440/tcp
    networks:
      - omnileads
    stop_signal: SIGINT
    tty: true
    stdin_open: true
    depends_on:
      - dialer-postgresql
    environment:
      - GEARMAN_JOB_SERVERS=${GEARMAN_JOB_SERVERS}
      - WEBSOCKET_SERVER=${WEBSOCKET_SERVER}

  scheduler-api:
    build:
      context: ./scheduler/src
    image: ${SCHEDULER_IMG}
    ports:
      - ${DIALER_SCHEDULER_EXT_BIND_IP:-0.0.0.0}:${DIALER_SCHEDULER_EXT_PORT:-1441}:1441/tcp
    networks:
      - omnileads
    stop_signal: SIGINT
    tty: true
    stdin_open: true
    environment:
      - GEARMAN_JOB_SERVERS=${GEARMAN_JOB_SERVERS}
      - REDIS_DIALER_SERVER=${REDIS_DIALER_SERVER}
      - REDIS_DIALER_PORT=${REDIS_DIALER_PORT}
      - TZ=${TZ}

  listener:
    build:
      context: ./websocket_ari/src
    image: ${LISTENER_IMG}
    networks:
      - omnileads
    tty: true
    stdin_open: true
    environment:
      - ASTERISK_HOST=${ASTERISK_DIALER_HOSTNAME}
      - ASTERISK_PORT=${ASTERISK_DIALER_ARI_PORT}
      - ASTERISK_USER=${AMI_USER}
      - ASTERISK_PASS=${AMI_PASSWORD}
      - ASTERISK_APP=call_manager
      - ASTERISK_APP_DIALER=call_manager_dialer
      - TZ=${TZ}
      - GEARMAN_JOB_SERVERS=${GEARMAN_JOB_SERVERS}
    depends_on:
      dialer-postgresql:
        condition: service_healthy
        required: true
      start-campaign:
        condition: service_started
        required: true
      dialer-acd:
        condition: service_started
        required: true

  start-campaign:
    build:
      context: ./workers/handle-campaign/src
    image: ${WORKER_IMG}
    networks:
      - omnileads
    tty: true
    stdin_open: true
    environment:
      - GEARMAN_JOBS=start-campaign
      - GEARMAN_JOB_SERVERS=${GEARMAN_JOB_SERVERS}
      - ASTERISK_HOST=${ASTERISK_DIALER_HOSTNAME}
      - ASTERISK_PORT=${ASTERISK_DIALER_ARI_PORT}
      - ASTERISK_USER=${AMI_USER}
      - ASTERISK_PASS=${AMI_PASSWORD}
      - ASTERISK_APP=call_manager
      - CAPS=${DIALER_CAPS}
      - DIALER_ACD_HOST=pstn_gateway
      - POSTGRES_OML_SERVER=${PGHOST}
      - POSTGRES_OML_PORT=${PGPORT}
      - POSTGRES_OML_USER=${PGUSER}
      - POSTGRES_OML_PASSWORD=${PGPASSWORD}
      - POSTGRES_DIALER_SERVER=${POSTGRES_DIALER_SERVER}
      - POSTGRES_DIALER_PORT=${POSTGRES_DIALER_PORT}
