  dialer-postgresql:
    dns: 8.8.8.8
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${POSTGRES_DIALER_USER}
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DB=${POSTGRES_DIALER_DB}
      - PGPORT=5433
    image: ${POSTGRES_IMG}
    networks:
      - omnileads
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DIALER_USER} -d ${POSTGRES_DIALER_DB} -q"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    privileged: true
    restart: on-failure
    stop_grace_period: 1m30s
    volumes:
      - dialer-postgresql:/var/lib/postgresql/data
      - ../omnidialer.sql:/docker-entrypoint-initdb.d/init.sql
